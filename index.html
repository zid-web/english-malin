<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>English Malin</title>
  <meta name="description" content="Parcours d'anglais en 3 niveaux (A1 → B2), installable et utilisable hors ligne.">

  <!-- ===== PWA : manifest, couleur de thème, icônes ===== -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1b2a4a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1628" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon-192-v2.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192-v2.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="English Malin">

  <!-- ===== Thème appliqué AVANT le rendu (évite le flash clair/sombre) ===== -->
  <script>
    try {
      const t = localStorage.getItem("eq:theme");
      if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
    } catch (e) { /* stockage indisponible : on suit le système */ }
  </script>

  <!-- ===== Polices : titres expressifs + texte très lisible (Atkinson Hyperlegible) ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">

  <!-- ===== Tailwind (CDN, version figée pour la démo) ===== -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    // Les couleurs Tailwind pointent vers nos tokens CSS → clair/sombre gérés en un seul endroit.
    // Garde-fou : si le CDN est injoignable (1re visite hors ligne), on n'interrompt pas la page.
    if (window.tailwind) tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "var(--bg)", surface: "var(--surface)", ink: "var(--ink)", muted: "var(--muted)",
            line: "var(--line)", accent: "var(--accent)", ok: "var(--ok)", ko: "var(--ko)",
          },
          fontFamily: {
            display: ['"Fredoka"', "system-ui", "sans-serif"],
            body: ['"Atkinson Hyperlegible"', "system-ui", "sans-serif"],
          },
        },
      },
    };
  </script>

  <style>
    /* Mise en page : colonne unique mobile-first, barre d'onglets en bas sur mobile, en haut dès 768px. */
    :root {
      --bg: #f4f6fb;        /* papier légèrement bleuté */
      --surface: #ffffff;
      --ink: #1b2a4a;       /* bleu encre */
      --muted: #5a6683;
      --line: #dde3ef;
      --accent: #d7263d;    /* rouge « boîte aux lettres » britannique */
      --accent-ink: #ffffff;
      --ok: #12805c;
      --ko: #c2410c;
      --l1: #f2b705; --l2: #2a9d8f; --l3: #d7263d; /* couleur par niveau */
      --sun: #f59e0b;       /* étoiles, récompenses */
      --hero: #ffe8d6;      /* fond pêche du bandeau de la mascotte */
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1628; --surface: #16213a; --ink: #e8ecf6; --muted: #9aa6c2; --line: #263453;
        --accent: #ff5a6e; --accent-ink: #0e1628; --ok: #3ccf9a; --ko: #fb923c; --sun: #fbbf24; --hero: #2a2340; color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e1628; --surface: #16213a; --ink: #e8ecf6; --muted: #9aa6c2; --line: #263453;
      --accent: #ff5a6e; --accent-ink: #0e1628; --ok: #3ccf9a; --ko: #fb923c; --sun: #fbbf24; --hero: #2a2340; color-scheme: dark;
    }

    /* « hidden » doit toujours l'emporter sur les classes Tailwind (flex, inline-flex…) */
    [hidden] { display: none !important; }
    html, body { background: var(--bg); color: var(--ink); }
    body {
      font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
      font-size: 1rem; line-height: 1.6;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }
    h1, h2, h3 { font-family: "Fredoka", system-ui, sans-serif; text-wrap: balance; line-height: 1.15; }
    .eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Boutons */
    .btn { display: inline-flex; align-items: center; gap: .5rem; padding: .7rem 1.1rem; border-radius: .75rem;
           font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
    .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* Onglets */
    .tab[aria-selected="true"] { color: var(--accent); }
    .tab[aria-selected="true"] .tab-dot { background: var(--accent); }

    /* Cartes de niveau : seul élément « carte » de la page, la bande colorée encode le niveau */
    .level-card { background: var(--surface); border: 1px solid var(--line); border-radius: 1rem; }
    .level-card[data-locked="true"] { opacity: .6; }
    .meter { height: .5rem; border-radius: 99px; background: var(--line); overflow: hidden; }
    .meter > span { display: block; height: 100%; background: var(--fill, var(--accent)); transition: width .6s ease; }

    /* Flashcards (niveau 1) : retournement 3D */
    .flash { display: block; width: 100%; perspective: 800px; aspect-ratio: 1; max-width: 100%; }
    .flash-inner { display: block; position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
    .flash:hover .flash-inner { transform: translateY(-3px); }
    .flash[data-flipped="true"]:hover .flash-inner { transform: rotateY(180deg) translateY(-3px); }
    .flash[data-flipped="true"] .flash-inner { transform: rotateY(180deg); }
    .flash-face { position: absolute; inset: 0; display: grid; place-items: center; border-radius: .9rem;
                  background: var(--surface); border: 1px solid var(--line); box-shadow: 0 5px 0 var(--line);
                  backface-visibility: hidden; padding: .5rem; text-align: center; }
    .flash-face.back { transform: rotateY(180deg); background: var(--ink); color: var(--bg); }

    /* Choix de quiz */
    .choice { width: 100%; text-align: left; padding: .85rem 1rem; border-radius: .75rem; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
    .choice[data-state="correct"] { border-color: var(--ok); color: var(--ok); }
    .choice[data-state="wrong"] { border-color: var(--ko); color: var(--ko); }

    /* ===== Refonte illustrée : cartes, mascotte, animations ===== */
    .hero { background: var(--hero); border-radius: 1.5rem; }
    .bubble { position: relative; background: var(--surface); color: var(--ink); border-radius: 1.1rem; padding: .7rem 1rem; font-weight: 700; box-shadow: 0 6px 0 var(--line); }
    .bubble::before { content: ""; position: absolute; left: -10px; top: 50%; translate: 0 -50%; border: 10px solid transparent; border-right-color: var(--surface); border-left: 0; }
    .mascot { flex-shrink: 0; animation: bob 3s ease-in-out infinite; transform-origin: 50% 90%; }
    .mascot[data-mood="wow"] { animation: hop .5s ease; }
    .mascot[data-mood="sad"] { animation: shake .4s ease; }
    .star { color: var(--sun); }

    /* Cartes : bandeau illustré + ombre « posée » ; soulèvement au survol */
    .level-card { overflow: hidden; box-shadow: 0 6px 0 var(--line); transition: transform .2s, box-shadow .2s; }
    .level-card:not([data-locked="true"]):hover { transform: translateY(-4px) rotate(-.4deg); box-shadow: 0 10px 0 var(--line); }
    .scene { display: block; width: 100%; height: 130px; }
    .lesson-card { background: var(--surface); border: 1px solid var(--line); border-radius: 1.25rem; overflow: hidden; text-align: left;
                   box-shadow: 0 5px 0 var(--line); transition: transform .2s, box-shadow .2s; scroll-snap-align: start; }
    .lesson-card:hover { transform: translateY(-4px); box-shadow: 0 9px 0 var(--line); }
    .lesson-art { display: flex; justify-content: center; gap: .4rem; padding: 1.1rem .5rem; font-size: 2.2rem; }
    .lesson-art span { display: inline-block; animation: bob 3s ease-in-out infinite; animation-delay: calc(var(--j) * .35s); }
    .rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 240px); gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: .75rem; }
    .badge-done { background: var(--ok); color: var(--surface); }

    /* Entrée en cascade (contenu visible au repos : on anime depuis un léger décalage, jamais depuis opacity 0) */
    .pop-in { animation: pop .45s cubic-bezier(.2,.9,.3,1.3) both; animation-delay: calc(var(--i, 0) * 70ms); }
    .choice { transition: transform .15s; }
    .choice:not(:disabled):hover { transform: translateX(4px); }
    .choice[data-state="correct"] { animation: pop .35s ease; }
    .choice[data-state="wrong"] { animation: shake .35s ease; }
    .float { animation: floaty 4s ease-in-out infinite; animation-delay: var(--d, 0s); }
    .spin-slow { animation: spin 30s linear infinite; }
    .pulse { animation: pulse 1.8s ease-in-out infinite; }
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

    @keyframes bob { 50% { transform: translateY(-5px); } }
    @keyframes hop { 40% { transform: translateY(-14px) scale(1.05); } }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @keyframes pop { from { transform: scale(.94); } to { transform: none; } }
    @keyframes floaty { 50% { transform: translateY(-8px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: .35; } }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  </style>
</head>

<body class="min-h-screen pb-28 md:pb-10">
  <!-- ===================== EN-TÊTE ===================== -->
  <header class="max-w-5xl mx-auto flex items-center justify-between gap-3 pt-4 pb-3">
    <a href="./" class="flex items-center gap-2 font-display text-xl font-extrabold">
      <img src="icons/icon-192-v2.png" alt="" width="32" height="32" class="rounded-lg">
      English Malin
    </a>

    <div class="flex items-center gap-2">
      <!-- Bouton d'installation : caché tant que le navigateur ne propose pas l'installation -->
      <button id="install-btn" class="btn !py-2 !px-3 text-sm" hidden aria-label="Installer l'application">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></svg>
        <span class="hidden sm:inline">Installer l'application</span><span class="sm:hidden">Installer</span>
      </button>
      <button id="theme-btn" class="btn !p-2" aria-label="Basculer le thème clair / sombre">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <!-- ===================== NAVIGATION PAR ONGLETS ===================== -->
  <!-- Mobile : barre fixe en bas (zone du pouce) · Desktop : sous l'en-tête -->
  <nav class="fixed md:static bottom-0 inset-x-0 z-20 bg-surface md:bg-transparent border-t md:border-0 border-line"
       style="padding-bottom: env(safe-area-inset-bottom, 0px)">
    <div role="tablist" aria-label="Sections" class="max-w-5xl mx-auto grid grid-cols-3 md:flex md:gap-6 md:border-b md:border-line">
      <button role="tab" class="tab flex flex-col md:flex-row items-center gap-1 md:gap-2 py-2 md:py-3 font-bold text-muted" data-tab="levels" aria-controls="panel-levels" id="tab-levels">
        <span class="tab-dot w-1.5 h-1.5 rounded-full bg-transparent"></span>Niveaux
      </button>
      <button role="tab" class="tab flex flex-col md:flex-row items-center gap-1 md:gap-2 py-2 md:py-3 font-bold text-muted" data-tab="learn" aria-controls="panel-learn" id="tab-learn">
        <span class="tab-dot w-1.5 h-1.5 rounded-full bg-transparent"></span>Apprendre
      </button>
      <button role="tab" class="tab flex flex-col md:flex-row items-center gap-1 md:gap-2 py-2 md:py-3 font-bold text-muted" data-tab="quiz" aria-controls="panel-quiz" id="tab-quiz">
        <span class="tab-dot w-1.5 h-1.5 rounded-full bg-transparent"></span>Quiz
      </button>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto pt-6">
    <!-- Bandeau hors ligne (piloté par app.js) -->
    <p id="offline-banner" class="mb-4 text-sm font-bold text-ko" hidden>Mode hors ligne : ta progression est enregistrée sur cet appareil.</p>

    <!-- ===================== TABLEAU DE BORD ===================== -->
    <section id="panel-levels" role="tabpanel" aria-labelledby="tab-levels" class="grid gap-8">
      <!-- Bandeau : Malin le renard + progression globale (rempli par app.js) -->
      <div class="hero p-5 md:p-7 grid gap-5 md:grid-cols-[1fr_minmax(0,22rem)] items-center">
        <div class="flex items-center gap-4 min-w-0">
          <div id="hero-mascot"></div>
          <div class="grid gap-2 min-w-0">
            <p class="bubble" id="hero-bubble">Hello! Prêt pour ta leçon ?</p>
            <h1 class="font-display text-3xl md:text-4xl font-bold">De tes premiers mots à l'actu en anglais.</h1>
          </div>
        </div>
        <div class="grid gap-2">
          <div class="flex justify-between text-sm font-bold">
            <span>Progression globale</span>
            <span id="global-label" class="tabular">0 %</span>
          </div>
          <div class="meter !h-3" role="progressbar" aria-label="Progression globale" aria-valuemin="0" aria-valuemax="100" id="global-meter" aria-valuenow="0">
            <span id="global-bar" style="width:0%"></span>
          </div>
          <p class="text-sm font-bold tabular"><span class="star" aria-hidden="true">★</span> <span id="star-count">0</span> étoiles gagnées</p>
        </div>
      </div>

      <!-- Leçons du niveau en cours (cartes illustrées, défilement horizontal) -->
      <div class="grid gap-3">
        <h2 class="font-display text-2xl font-bold" id="rail-title">Tes leçons</h2>
        <div id="lessons-rail" class="rail"></div>
      </div>

      <!-- Les 3 niveaux -->
      <div class="grid gap-3">
        <h2 class="font-display text-2xl font-bold">Les 3 niveaux</h2>
        <div id="levels-grid" class="grid gap-5 md:grid-cols-3"></div>
      </div>
    </section>

    <!-- ===================== ZONE D'APPRENTISSAGE ===================== -->
    <section id="panel-learn" role="tabpanel" aria-labelledby="tab-learn" hidden></section>

    <!-- ===================== ZONE DE QUIZ ===================== -->
    <section id="panel-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden></section>
  </main>

  <!-- Toast (mise à jour disponible, sauvegarde, installation…) -->
  <div id="toast" role="status" aria-live="polite"
       class="fixed left-1/2 -translate-x-1/2 bottom-24 md:bottom-6 z-30 max-w-[calc(100%-32px)] bg-ink text-bg rounded-xl px-4 py-3 text-sm font-bold shadow-lg flex items-center gap-3" hidden></div>

  <!-- ===================== LOGIQUE APPLICATIVE ===================== -->
  <script type="module" src="js/app.js"></script>

  <!-- ===================== PWA : SERVICE WORKER + INSTALLATION ===================== -->
  <script type="module">
    import { showToast } from "./js/app.js";

    /* ---------- 1. Enregistrement du Service Worker ---------- */
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const reg = await navigator.serviceWorker.register("./sw.js", { scope: "./", updateViaCache: "none" });

          // Une nouvelle version s'installe : on propose de recharger (jamais de rechargement forcé).
          reg.addEventListener("updatefound", () => {
            const worker = reg.installing;
            worker?.addEventListener("statechange", () => {
              if (worker.state === "installed" && navigator.serviceWorker.controller) {
                showToast("Nouvelle version disponible.", "Recharger", () => worker.postMessage({ type: "SKIP_WAITING" }));
              }
            });
          });

          // Vérifie les mises à jour quand l'utilisateur revient sur l'app.
          document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") reg.update().catch(() => {});
          });
        } catch (err) {
          console.error("[PWA] Échec d'enregistrement du Service Worker :", err);
        }
      });

      // Le nouveau SW a pris le contrôle → rechargement unique pour charger les nouveaux fichiers.
      let reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
    }

    /* ---------- 2. Bouton « Installer l'application » ---------- */
    const installBtn = document.getElementById("install-btn");
    let deferredPrompt = null; // BeforeInstallPromptEvent mis de côté

    const isStandalone = () =>
      window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

    // Chrome / Edge / Android : le navigateur signale que l'app est installable.
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();          // on bloque la mini-barre native…
      deferredPrompt = event;          // …pour la déclencher depuis notre bouton
      if (!isStandalone()) installBtn.hidden = false;
    });

    installBtn.addEventListener("click", async () => {
      // iOS / Safari : pas d'API d'installation → instructions manuelles.
      if (!deferredPrompt) {
        showToast("Sur iPhone / iPad : bouton Partager, puis « Sur l'écran d'accueil ».");
        return;
      }
      installBtn.disabled = true;
      deferredPrompt.prompt();                         // ouvre la fenêtre native
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;                           // un événement ne sert qu'une fois
      installBtn.disabled = false;
      installBtn.hidden = true;
      if (outcome === "dismissed") showToast("Installation annulée. Tu pourras le refaire depuis le menu du navigateur.");
    });

    window.addEventListener("appinstalled", () => {
      installBtn.hidden = true;
      deferredPrompt = null;
      showToast("English Malin est installée !");
    });

    // iOS Safari (jamais de beforeinstallprompt) : on affiche quand même le bouton, qui guide l'utilisateur.
    const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (isIos && !isStandalone()) installBtn.hidden = false;
  </script>
</body>
</html>
